name: Publish Floatix 2.2.2 verified parts
on: workflow_dispatch
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Reconstruct and verify the tested installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release download v2.2.2 --pattern 'floatix-222.part*'
          cat floatix-222.part* > update.bsdiff
          echo '87062c443254e208132a037eb273303b37321b4fa95c1c996cbf9262440584ac  update.bsdiff' | sha256sum --check
          mv update.bsdiff Floatix-2.2.2-Setup.exe
          echo '87062c443254e208132a037eb273303b37321b4fa95c1c996cbf9262440584ac  Floatix-2.2.2-Setup.exe' > Floatix-2.2.2-Setup.sha256
          sha256sum --check Floatix-2.2.2-Setup.sha256
          gh release upload v2.2.2 Floatix-2.2.2-Setup.exe Floatix-2.2.2-Setup.sha256 --clobber
          release_id=$(gh api "repos/$GH_REPO/releases" --jq '.[] | select(.tag_name == "v2.2.2") | .id')
          gh api --method PATCH "repos/$GH_REPO/releases/$release_id" -F draft=false -f make_latest=true
          gh api "repos/$GH_REPO/releases/$release_id/assets" --jq '.[] | select(.name | startswith("floatix-222.part")) | .id' | while read asset_id; do
            gh api --method DELETE "repos/$GH_REPO/releases/assets/$asset_id"
          done
