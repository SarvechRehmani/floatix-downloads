name: Publish Floatix 2.2.3 verified parts
on: workflow_dispatch
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Reconstruct and verify the tested installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release download v2.2.3 --pattern 'floatix-223.part*'
          cat floatix-223.part* > update.bsdiff
          echo '07c80fe5206ca3f2f8fe74ed93e681e031493680da1efedc1f279466d5f9b0d7  update.bsdiff' | sha256sum --check
          mv update.bsdiff Floatix-2.2.3-Setup.exe
          echo '07c80fe5206ca3f2f8fe74ed93e681e031493680da1efedc1f279466d5f9b0d7  Floatix-2.2.3-Setup.exe' > Floatix-2.2.3-Setup.sha256
          sha256sum --check Floatix-2.2.3-Setup.sha256
          gh release upload v2.2.3 Floatix-2.2.3-Setup.exe Floatix-2.2.3-Setup.sha256 --clobber
          release_id=$(gh api "repos/$GH_REPO/releases" --jq '.[] | select(.tag_name == "v2.2.3") | .id')
          gh api --method PATCH "repos/$GH_REPO/releases/$release_id" -F draft=false -f make_latest=true
          gh api "repos/$GH_REPO/releases/$release_id/assets" --jq '.[] | select(.name | startswith("floatix-223.part")) | .id' | while read asset_id; do
            gh api --method DELETE "repos/$GH_REPO/releases/assets/$asset_id"
          done
